<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪄 AI 咒語教室</title>
<style>
  :root{
    --bg:#fff8ef; --card:#ffffff; --ink:#33302b; --sub:#8d8272;
    --main:#0b7285; --main-soft:#d9f2f6;
    --shadow:0 4px 14px rgba(51,48,43,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--ink);
    min-height:100vh;padding:28px 16px 48px;
  }
  .wrap{max-width:560px;margin:0 auto}
  header{text-align:center;margin-bottom:26px}
  h1{font-size:1.9rem;letter-spacing:.05em}
  header p{color:var(--sub);margin-top:8px;font-size:.95rem}
  .cards{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:480px){.cards{grid-template-columns:1fr 1fr}}
  a.card{
    display:block;background:var(--card);border-radius:16px;
    padding:20px 18px;text-decoration:none;color:var(--ink);
    box-shadow:var(--shadow);border:2px solid transparent;
    transition:transform .15s,border-color .15s;
  }
  a.card:active,a.card:hover{transform:translateY(-2px);border-color:var(--main)}
  .card .emoji{font-size:2rem;display:block;margin-bottom:8px}
  .card h2{font-size:1.1rem;margin-bottom:6px}
  .card p{font-size:.85rem;color:var(--sub);line-height:1.5}
  .card .go{
    display:inline-block;margin-top:10px;font-size:.8rem;font-weight:700;
    color:var(--main);background:var(--main-soft);
    padding:4px 12px;border-radius:999px;
  }
  footer{text-align:center;color:var(--sub);font-size:.8rem;margin-top:32px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🪄 AI 咒語教室</h1>
    <p>選一間教室，開始今天的練習吧！</p>
  </header>
  <div class="cards">
    <a class="card" href="poem.html">
      <span class="emoji">🖋️</span>
      <h2>詩詞練功房</h2>
      <p>把課本裡的詩一字不改交給 AI，練習出好咒語。</p>
      <span class="go">進入教室 →</span>
    </a>
    <a class="card" href="history.html">
      <span class="emoji">🕰️</span>
      <h2>台灣歷史時光機</h2>
      <p>搭上時光機，走一趟台灣歷史的大事年表。</p>
      <span class="go">進入教室 →</span>
    </a>
    <a class="card" href="terrain.html">
      <span class="emoji">⛰️</span>
      <h2>台灣地形大冒險</h2>
      <p>從高山到海岸，認識台灣各種地形的秘密。</p>
      <span class="go">進入教室 →</span>
    </a>
    <a class="card" href="handbook.html">
      <span class="emoji">📖</span>
      <h2>AI 咒語實作手冊</h2>
      <p>三個約定與實作步驟，教你下出安全又好用的咒語。</p>
      <span class="go">進入教室 →</span>
    </a>
  </div>
  <footer>AI 課堂示範作品</footer>
</div>
</body>
</html>
