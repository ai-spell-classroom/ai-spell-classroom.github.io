<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 陪跑教室｜投影母版定稿 v0.3.2</title><style>:root{--paper:#fdf9f0;--ink:#303b30;--green:#4a7a2e;--deep:#315c28;--leaf:#7ab648;--teal:#176e77;--line:#c9d8b7;--pink:#f2c9c9;--blue:#bbd3e3}*{box-sizing:border-box}body{margin:0;background:#dfeeea;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}.slide{position:relative;width:1600px;height:900px;overflow:hidden;padding:80px 110px;background:var(--paper);page-break-after:always;break-after:page}.slide:before{content:"";position:absolute;inset:0;opacity:.33;background-image:radial-gradient(rgba(74,122,46,.24) .6px,transparent .8px);background-size:7px 7px}.slide>*{position:relative}.kicker{display:inline-block;padding:8px 14px;background:var(--teal);color:white;border-radius:0 16px 16px 16px;font-size:18px;font-weight:900;letter-spacing:.08em}.kicker.pink{background:#b86b75}.kicker.gold{background:#a68018}.number{position:absolute;right:105px;top:72px;color:var(--leaf);font-size:54px;font-weight:900}.logo{position:absolute;right:110px;bottom:54px;color:#527050;font-size:16px;font-weight:800}h1{margin:24px 0 18px;color:var(--deep);font-size:64px;line-height:1.2}h2{margin:0;color:var(--deep);font-size:38px}.lead{max-width:1060px;margin:0;color:#557454;font-size:28px;font-weight:800;line-height:1.6}.big{margin:35px 0;color:#315c28;font-size:48px;font-weight:900;line-height:1.4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:42px}.card{padding:26px;border:2px solid var(--line);border-radius:18px;background:rgba(255,255,255,.72);font-size:26px;line-height:1.45;font-weight:800}.card b{display:block;color:var(--green);font-size:38px}.steps{display:grid;gap:17px;margin-top:38px;max-width:1180px}.step{display:grid;grid-template-columns:74px 1fr;gap:18px;align-items:center;padding:17px 24px;border-left:8px solid var(--teal);border-radius:14px;background:#eaf5f1;font-size:30px;font-weight:800}.n{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--green);color:white}.quote{margin-top:35px;padding:30px;border-left:10px solid var(--teal);background:#eaf5f1;color:#244d4e;font-size:32px;font-weight:800;line-height:1.6}.note{margin-top:28px;padding:22px;border-radius:14px;background:#fff8e6;color:#6d613b;font-size:25px;font-weight:800;line-height:1.5}.slot{display:grid;place-items:center;width:180px;height:180px;border:4px dashed #a68018;border-radius:14px;color:#896b14;font-size:28px;font-weight:900;text-align:center;background:#fffdf6}.split{display:grid;grid-template-columns:1fr 210px;gap:50px;align-items:center}.tape{position:absolute;width:210px;height:38px;right:260px;top:52px;background:rgba(242,201,201,.85);transform:rotate(3deg)}@media print{@page{size:16in 9in;margin:0}body{background:white}.slide{margin:0}}@media screen{.slide{margin:18px auto;box-shadow:0 16px 38px rgba(55,84,51,.18)}}</style></head><body><div id="deck"></div><script>
const s=[
['開場','AI 陪跑教室','親子共學版・詩詞練功房','今天不是叫 AI 幫我完成；是我先想清楚，再讓 AI 幫我把想法變成可以玩的作品。'],
['今天的成果','帶走的不是一張答案','一冊 AI 咒語師護照 ＋ 三張咒語卡','護照裡留著我的來源、我的改法、查證官的簽證；卡片只負責提醒，不拿來填寫。'],
['角色','誰來做？誰來查？','孩子＝咒語師；家長＝查證官','孩子挑來源、操作、寫下改法；家長只問問題、陪對兩題、最後蓋章。'],
['三個動作','今天只記住三個動作','先想 THINK → 再說 CAST → 再檢查 CHECK','這不是複製貼上課；每一個作品都要留下「我怎麼讓它變好」的證據。'],
['五種能力','我正在練哪一種 AI 能力？','說清楚・找根據・改一版・找學伴・保護自己','今天先解鎖：說清楚、找根據、改一版。課末每位孩子親自操作 3 分鐘：「請 AI 考我，不替我答」，領取「問」的虛線體驗章。'],
['來源','來源卡是什麼？','挑卡＝選來源；寫字在護照','每個人選 1 到 2 張詩詞來源卡。卡片是給人和 AI 看清楚的原文，不是用來填空或再抄寫。'],
['核對','拍照後，先做這一步','請 AI 逐字列出它讀到的每一首詩；我說「沒錯」才開始','咒語師對著卡片或課本核對；查證官在旁邊陪孩子找出不一樣的字。'],
['實作','現在，先寫護照再輸入','1．挑來源卡　2．在護照寫想改的玩法　3．比讚後輸入','孩子的筆跡才是本堂課的思考證據。'],
['救援','AI 講了一堆話卻沒動工？','請執行，把遊戲做出來。','看到可以玩的「預覽」才算完成；不是看到一堆程式或計畫就算。'],
['查證','第一版做好後，先不要急著加特效','跟來源卡或課本對 2 題，再說出：我原本＿＿，我改成＿＿，所以現在＿＿。','查證官這時才蓋任務簽證。'],
['延伸','AI 學伴上線：輪到我操作','請考我這首詩，一次一題，不要直接給答案。','課末 10 分鐘：每位孩子自己操作 3 分鐘，親眼看 AI 出題、自己作答；回家也能改成「請考我台灣歷史 8 題」。'],
['收尾','今天的儀式是任務簽證','不是另發執照；是把你真的完成的思考、查證和改版，蓋進自己的護照。','作品完成後可換 QR 貼紙，和咒語師夥伴交換作品。'],
['問卷','給家長的下一步','問卷／同意書 QR 貼紙位','護照是孩子的紀念品；研究問卷使用獨立 QR，不放進護照。']
];const root=document.querySelector('#deck');s.forEach((x,i)=>{const [tag,title,sub,copy]=x;let content='';if(i===2){content='<div class="grid"><div class="card"><b>咒語師</b>選來源<br>寫咒語<br>做決定</div><div class="card"><b>查證官</b>問問題<br>對兩題<br>最後蓋章</div><div class="card"><b>AI</b>照我說的做<br>不是替我想完</div></div>'}else if(i===3){content='<div class="steps"><div class="step"><span class="n">1</span>先想：我要練什麼？我選哪個來源？</div><div class="step"><span class="n">2</span>再說：我希望 AI 怎麼做？</div><div class="step"><span class="n">3</span>再檢查：它真的照做了嗎？</div></div>'}else if(i===6||i===8||i===10){content='<div class="quote">「'+sub+'」</div><div class="note">'+copy+'</div>'}else if(i===12){content='<div class="split"><div><p class="big">'+sub+'</p><p class="lead">'+copy+'</p></div><div class="slot">問卷／同意書<br>QR 貼紙位</div></div>'}else{content='<p class="big">'+sub+'</p><p class="lead">'+copy+'</p>'}root.insertAdjacentHTML('beforeend',`<section class="slide"><span class="tape"></span><p class="kicker ${i===2?'pink':''}">${tag}</p><span class="number">${String(i+1).padStart(2,'0')}</span><h1>${title}</h1>${content}<span class="logo">🍀 Learn AI with Tarshar</span></section>`)});</script></body></html>
