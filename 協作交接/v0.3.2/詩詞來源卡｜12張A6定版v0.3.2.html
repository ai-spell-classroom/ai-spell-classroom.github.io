<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 咒語師｜12 張詩詞來源卡｜A6 建議版</title>
<style>@page{size:105mm 148mm;margin:0}
:root{--paper:#fdf9f0;--ink:#303b30;--green:#4a7a2e;--deep:#315c28;--teal:#176e77;--line:#c9d8b7;--soft:#eef6da}*{box-sizing:border-box}body{margin:0;background:#dfeeea;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}.card{position:relative;width:105mm;height:148mm;overflow:hidden;padding:10mm 9mm;background:var(--paper);page-break-after:always;break-after:page}.card:before{content:"";position:absolute;inset:0;opacity:.3;background-image:radial-gradient(rgba(74,122,46,.24) .45px,transparent .6px);background-size:5px 5px}.card>*{position:relative}.ey{margin:0;color:var(--teal);font-size:7pt;letter-spacing:.12em;font-weight:900}.ey:before{content:"";display:inline-block;width:4px;height:4px;margin-right:5px;border:1.5px solid var(--teal);border-radius:50%}.no{position:absolute;right:9mm;top:9mm;color:#7ab648;font-weight:900;font-size:17pt}.title{margin:7mm 0 1mm;color:var(--deep);font-size:25pt;line-height:1.12}.author{margin:0;color:#557454;font-size:10pt;font-weight:800}.rule{height:1px;margin:5mm 0;background:var(--line)}.poem{white-space:pre-line;color:#293f2b;font-size:13pt;font-weight:800;line-height:1.9;letter-spacing:.055em}.long .poem{font-size:9.2pt;line-height:1.72}.medium .poem{font-size:10.4pt;line-height:1.76}.source{position:absolute;left:9mm;right:9mm;bottom:9mm;padding:3mm;border-left:3px solid var(--teal);background:#eaf5f1;color:#426663;font-size:6.8pt;line-height:1.45}.mascot{position:absolute;right:9mm;bottom:31mm;width:12mm;height:12mm;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:8pt;background:#fff}.back{display:flex;flex-direction:column;justify-content:center;text-align:center}.back h1{margin:2mm 0;color:var(--deep);font-size:25pt}.back .tag{margin:0;color:var(--teal);font-size:8pt;font-weight:900;letter-spacing:.1em}.steps{margin:8mm 0 0;text-align:left}.step{margin:3mm 0;padding:3.5mm;border:1px solid var(--line);border-radius:4mm;background:rgba(255,255,255,.72);font-size:10pt;line-height:1.5;font-weight:700}.step b{color:var(--green)}.warn{margin-top:6mm;padding:3mm;background:#fff8e6;color:#6d613b;text-align:left;font-size:8pt;line-height:1.5}.footer{position:absolute;left:9mm;right:9mm;bottom:8mm;border-top:1px solid var(--line);padding-top:2mm;text-align:left;color:#607360;font-size:6.5pt}@media screen{.card{margin:12mm auto;box-shadow:0 15px 35px rgba(55,84,51,.16)}}@media print{@page{size:A6 portrait;margin:0}body{background:white}.card{margin:0;box-shadow:none}}
</style></head><body><div id="cards"></div><script>
const cards=[
['江雪','唐・柳宗元','千山鳥飛絕，\n萬徑人蹤滅。\n孤舟蓑笠翁，\n獨釣寒江雪。',''],
['春望','唐・杜甫','國破山河在，城春草木深。\n感時花濺淚，恨別鳥驚心。\n烽火連三月，家書抵萬金。\n白頭搔更短，渾欲不勝簪。','medium'],
['聞官軍收河南河北','唐・杜甫','劍外忽傳收薊北，初聞涕淚滿衣裳。\n卻看妻子愁何在，漫卷詩書喜欲狂。\n白日放歌須縱酒，青春作伴好還鄉。\n即從巴峽穿巫峽，便下襄陽向洛陽。','medium'],
['遊園不值','宋・葉紹翁','應憐屐齒印蒼苔，\n小扣柴扉久不開。\n春色滿園關不住，\n一枝紅杏出牆來。',''],
['己亥雜詩（其五）','清・龔自珍','浩蕩離愁白日斜，\n吟鞭東指即天涯。\n落紅不是無情物，\n化作春泥更護花。',''],
['石灰吟','明・于謙','千錘萬鑿出深山，\n烈火焚燒若等閒。\n粉骨碎身渾不怕，\n要留清白在人間。',''],
['竹石','清・鄭燮','咬定青山不放鬆，\n立根原在破巖中。\n千磨萬擊還堅勁，\n任爾東西南北風。',''],
['題臨安邸','宋・林升','山外青山樓外樓，\n西湖歌舞幾時休？\n暖風薰得遊人醉，\n直把杭州作汴州。',''],
['觀書有感（其一）','宋・朱熹','半畝方塘一鑑開，\n天光雲影共徘徊。\n問渠那得清如許？\n為有源頭活水來。',''],
['滿江紅','宋・岳飛','怒髮衝冠，憑欄處、瀟瀟雨歇。\n抬望眼、仰天長嘯，壯懷激烈。\n三十功名塵與土，八千里路雲和月。\n莫等閒、白了少年頭，空悲切。\n靖康恥，猶未雪；臣子恨，何時滅？\n駕長車、踏破賀蘭山缺。\n壯志飢餐胡虜肉，笑談渴飲匈奴血。\n待從頭、收拾舊山河，朝天闕。','long'],
['登樂遊原','唐・李商隱','向晚意不適，\n驅車登古原。\n夕陽無限好，\n只是近黃昏。',''],
['泊秦淮','唐・杜牧','煙籠寒水月籠沙，\n夜泊秦淮近酒家。\n商女不知亡國恨，\n隔江猶唱後庭花。','']
];
const root=document.querySelector('#cards');cards.forEach((c,i)=>{const [title,author,poem,size]=c;root.insertAdjacentHTML('beforeend',`<section class="card ${size}"><p class="ey">POETRY SOURCE CARD</p><span class="no">${String(i+1).padStart(2,'0')}</span><h1 class="title">〈${title}〉</h1><p class="author">${author}</p><div class="rule"></div><div class="poem">${poem}</div><span class="mascot">小 D</span><div class="source">課本範圍：康軒國語五、六年級詩詞群<br><b>印前逐字核對：</b>請以本班實際使用的課本原文為最後依據；此為建議版，不以 AI 記憶取代課本。</div></section><section class="card back"><p class="ey">AI SPELL CLASSROOM</p><p class="tag">拍照交來源｜不要讓 AI 自己背</p><h1>〈${title}〉</h1><p class="author">${author}</p><div class="steps"><div class="step"><b>1．拍照</b>：一次拍 1 到 2 張卡，字要清楚。</div><div class="step"><b>2．先核對</b>：請 AI 逐字列出它讀到的每一首詩；我說「沒錯」才開始。</div><div class="step"><b>3．再做遊戲</b>：請做填空挑戰、排排看或隨機抽考。</div></div><div class="warn"><b>在家沒帶卡？</b>直接拍課本也可以；一樣先逐字核對。AI 講了一堆話卻沒動工？說：「請執行，把遊戲做出來。」</div><div class="footer">AI 咒語師護照｜來源卡 ${String(i+1).padStart(2,'0')}　🍀 Learn AI with Tarshar</div></section>`)});
</script></body></html>
